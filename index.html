  padding: 20px;
  max-width: 800px;

  margin-bottom: 5px;
}

.info {
  color: #aaa;
  font-size: 14px;
  margin-bottom: 15px;
}

button {
  background: #ff69b4;
  color: white;
  border: none;
  padding: 10px 16px;
  border-radius: 6px;
  cursor: pointer;
  margin: 10px 8px 15px 0;
  font-size: 14px;
}

button:hover {
  background: #e84d9d;
}

button:disabled {
  opacity: 0.6;
  cursor: wait;
}

.stats {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin: 10px 0 18px;
}

.stat {
  background: #222;
  padding: 12px;
  border-radius: 8px;
  flex: 1;
  min-width: 100px;
  text-align: center;
}

.stat strong {
  display: block;
  font-size: 22px;
}

.stat.online strong {
  color: #00ff00;
}

.stat.offline strong {
  color: #999;
}

.stat.errors strong {
  color: orange;
}

.model {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  padding: 10px 12px;
  margin: 4px 0;
  background: #222;
  border-radius: 6px;
  font-size: 14px;
}

.model a {
  color: inherit;
  text-decoration: none;
}

.model a:hover {
  color: #ff69b4;
}

.online {
  border-left: 5px solid #00ff00;
}

.offline {
  border-left: 5px solid #555;
}

.error {
  border-left: 5px solid orange;
}

.status {
  font-weight: bold;
  min-width: 110px;
  text-align: right;
}

.status-public {
  color: #00ff00;
}

.status-private {
  color: #ff69b4;
}

.status-group {
  color: #bf80ff;
}

.status-away {
  color: #ffd54f;
}

.status-hidden {
  color: #4db8ff;
}

.status-offline {
  color: #888;
}

.status-error,
.status-unknown,
.status-checking {
  color: orange;
}

#list {
  max-height: 520px;
  overflow-y: auto;
}

#log {
  font-size: 13px;
  color: #aaa;
  margin-top: 20px;
  max-height: 180px;
  overflow-y: auto;
  background: #1a1a1a;
  padding: 10px;
  border-radius: 6px;
}

#lastCheck {
  color: #888;
  font-size: 12px;
  margin-bottom: 12px;
}

// ============================================
// INSTELLINGEN EN STATUSSEN
// ============================================

const previousStatus = {};
const listEl = document.getElementById("list");
const logEl = document.getElementById("log");

let isChecking = false;
let audioCtx;

const ONLINE_STATUSES = [
  "public",
  "private",
  "group",
  "away",
  "hidden"
];

const ERROR_STATUSES = [
  "error",
  "unknown",
  "checking..."
];

const STATUS_LABELS = {
  public: "Openbaar",
  private: "Privéshow",
  group: "Groepsshow",
  away: "Afwezig",
  hidden: "Cam hidden",
  offline: "Offline",
  error: "Fout",
  unknown: "Onbekend",
  "checking...": "Controleren..."
};

function getStatusLabel(status) {
  return STATUS_LABELS[status] || status;
}

function getStatusClass(status) {
  const safeStatus = String(status)
    .toLowerCase()
    .replace(/[^a-z-]/g, "");

  return `status-${safeStatus || "unknown"}`;
}

// ============================================
// GELUID
// ============================================

function playBeep() {
  try {
    audioCtx = audioCtx ||
      new (window.AudioContext || window.webkitAudioContext)();

    if (audioCtx.state === "suspended") {
      audioCtx.resume();
    }

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.frequency.value = 880;

    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(
      0.01,
      audioCtx.currentTime + 0.8
    );

    osc.start();
    osc.stop(audioCtx.currentTime + 0.8);
  } catch (error) {
    console.error("Audiofout:", error);
  }
}

function testSound() {
  playBeep();
}

// ============================================
// BROWSERNOTIFICATIES
// ============================================

async function requestPermission() {
  if (!("Notification" in window)) {
    alert("Je browser ondersteunt geen notificaties.");
    return;
  }

  try {
    const permission = await Notification.requestPermission();

    if (permission === "granted") {
      alert("Notificaties zijn ingeschakeld!");
    } else {
      alert("Notificaties zijn niet toegestaan.");
    }
  } catch (error) {
    console.error("Notificatiefout:", error);
    alert("De notificatie-instelling kon niet worden aangepast.");
  }
}

function notifyPublic(name) {
  if (
    "Notification" in window &&
    Notification.permission === "granted"
  ) {
    new Notification(`${name} is nu PUBLIC!`, {
      body: "Het model is terug in de openbare show.",
      icon: "https://chaturbate.com/favicon.ico"
    });
  }
}

// ============================================
// ACTIVITEITENLOG
// ============================================

function log(message) {
  const time = new Date().toLocaleTimeString();
  const entry = document.createElement("div");

  entry.textContent = `[${time}] ${message}`;
  logEl.prepend(entry);

  while (logEl.children.length > 100) {
    logEl.lastChild.remove();
  }
}

// ============================================
// STATUS WEERGEVEN
// ============================================

function render() {
  let online = 0;
  let offline = 0;
  let errors = 0;

  listEl.innerHTML = MODELS.map(name => {
    const status = previousStatus[name] || "checking...";
    const isOnline = ONLINE_STATUSES.includes(status);
    const isError = ERROR_STATUSES.includes(status);

    if (isOnline) {
      online++;
    } else if (isError) {
      errors++;
    } else if (status === "offline") {
      offline++;
    }

    const rowClass = isOnline
      ? "online"
      : isError
        ? "error"
        : "offline";

    const label = getStatusLabel(status);
    const statusClass = getStatusClass(status);

    return `
      <div class="model ${rowClass}">
        <span>
          <a href="https://chaturbate.com/${encodeURIComponent(name)}/"
             target="_blank"
             rel="noopener noreferrer">${name}</a>
        </span>
        <span class="status ${statusClass}">${label}</span>
      </div>
    `;
  }).join("");

  document.getElementById("onlineCount").textContent = online;
  document.getElementById("offlineCount").textContent = offline;
  document.getElementById("errorCount").textContent = errors;
}

// ============================================
// ALLE MODELLEN CONTROLEREN
// ============================================

async function checkAll() {
  if (isChecking) return;

  isChecking = true;

  const button = document.getElementById("refreshButton");
  button.disabled = true;
  button.textContent = "Bezig met controleren...";

  try {
    const response = await fetch(
      "/.netlify/functions/cb-status?usernames=" +
        encodeURIComponent(MODELS.join(",")),
      { cache: "no-store" }
    );

    const data = await response.json();

    if (!response.ok || !data.statuses) {
      throw new Error(data.error || "Ongeldig antwoord van Netlify");
    }

    for (const name of MODELS) {
      const key = name.toLowerCase();
      const status = data.statuses[key] || "unknown";
      const oldStatus = previousStatus[name];

      // Alleen geluid en melding bij een overgang naar public.
      // De eerste controle geeft dus geen alarm.
      if (
        status === "public" &&
        oldStatus !== "public" &&
        oldStatus !== undefined
      ) {
        playBeep();
        notifyPublic(name);
        log(`🔔 ${name} is nu PUBLIC`);
      }

      if (status === "error") {
        log(`⚠️ Fout bij controleren van ${name}`);
      } else if (status === "unknown") {
        log(`⚠️ Status onbekend: ${name}`);
      }

      if (
        status === "offline" &&
        ONLINE_STATUSES.includes(oldStatus)
      ) {
        log(`${name} is offline gegaan`);
      }

      // Tijdelijke fouten overschrijven geen eerder bekende status.
      if (!ERROR_STATUSES.includes(status)) {
        previousStatus[name] = status;
      } else if (oldStatus === undefined) {
        previousStatus[name] = status;
      }
    }

    render();

    document.getElementById("lastCheck").textContent =
      "Laatste controle: " + new Date().toLocaleTimeString();

    log(
      data.complete
        ? "Controle afgerond."
        : "Gedeeltelijke controle afgerond."
    );
  } catch (error) {
    console.error("Controlefout:", error);
    log("⚠️ Controle mislukt: " + error.message);
  } finally {
    isChecking = false;
    button.disabled = false;
    button.textContent = "Nu controleren";
  }
}
