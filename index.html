
<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chaturbate Monitor</title>
<style>
*{box-sizing:border-box}
body{font-family:system-ui,sans-serif;background:#111;color:#eee;padding:20px;max-width:900px;margin:auto}
h1{color:#ff69b4}
.info{color:#aaa;font-size:14px}
button,select{background:#222;color:white;border:1px solid #555;padding:10px;border-radius:6px;cursor:pointer;margin:5px}
button{background:#ff69b4;border:0}
button:disabled{opacity:.6;cursor:wait}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:9px;margin:18px 0}
.stat{background:#222;padding:12px 8px;border-radius:8px;text-align:center;border-top:4px solid #666}
.stat strong{display:block;font-size:25px}
.stat span{font-size:12px}
.public{border-color:#00d65b}.private{border-color:#ff69b4}
.group{border-color:#bf80ff}.away{border-color:#ffd54f}
.hidden{border-color:#4db8ff}.offline{border-color:#777}
.unknown{border-color:#ff9800}
.filter-row{display:flex;align-items:center;flex-wrap:wrap;gap:5px;margin:12px 0}
.filter-row select{max-width:100%}
.model{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px;margin:5px 0;background:#222;border-radius:6px;border-left:5px solid #777;font-size:14px}
.model a{color:#eee;text-decoration:none;overflow-wrap:anywhere}
.model a:hover{color:#ff69b4}
.model.online{border-left-color:#00d65b}
.model.error{border-left-color:orange}
.status{font-weight:bold;text-align:right}
.status-public{color:#00d65b}
.status-private{color:#ff69b4}
.status-group{color:#bf80ff}
.status-away{color:#ffd54f}
.status-hidden{color:#4db8ff}
.status-offline{color:#999}
.status-unknown,.status-error,.status-checking{color:orange}
#list{max-height:520px;overflow-y:auto}
#log{font-size:13px;color:#aaa;margin-top:15px;max-height:180px;overflow-y:auto;background:#1a1a1a;padding:10px;border-radius:6px}
#lastCheck{font-size:12px;color:#888}
@media(max-width:480px){body{padding:12px}.model{font-size:13px;padding:9px}}
</style>
</head>
<body>

<h1>Chaturbate Monitor</h1>
<p class="info">Statuscontrole elke minuut. Geluid en melding alleen wanneer een model terugkeert naar Openbaar.</p>

<button onclick="requestPermission()">Notificaties toestaan</button>
<button onclick="testSound()">Test geluid</button>
<button onclick="checkAll()" id="refreshButton">Nu controleren</button>

<div class="stats">
  <div class="stat public"><strong id="publicCount">0</strong><span>Openbaar</span></div>
  <div class="stat private"><strong id="privateCount">0</strong><span>Privéshow</span></div>
  <div class="stat group"><strong id="groupCount">0</strong><span>Groepsshow</span></div>
  <div class="stat away"><strong id="awayCount">0</strong><span>Afwezig</span></div>
  <div class="stat hidden"><strong id="hiddenCount">0</strong><span>Cam hidden</span></div>
  <div class="stat offline"><strong id="offlineCount">0</strong><span>Offline</span></div>
  <div class="stat unknown"><strong id="unknownCount">0</strong><span>Onbekend / fout</span></div>
</div>

<div id="lastCheck">Nog niet gecontroleerd</div>

<div class="filter-row">
  <label for="sortFilter">Sorteren:</label>
  <select id="sortFilter" onchange="render()">
    <option value="online">Online bovenaan (alfabetisch)</option>
    <option value="alphabetical">Alles op alfabet</option>
    <option value="offline">Offline bovenaan (alfabetisch)</option>
  </select>
</div>

<div id="list"></div>
<h3>Activiteiten</h3>
<div id="log"></div>

<script>
const MODELS = [
"sensual_giaa","lastdawn","squikt","lana_kane_","ariana_valdirii",
"amylure","littlemia19","_bamby_baby_","yourkat","wizardkis",
"alison_miller9","milabunny_","mina_babe1","annaise_",
"badbitchcuteface","oliviaocean69","sophiesticate","marsabass",
"leah_greyy","emyii","juicy_jessye","eusebiaplageman",
"anyssyahoot","mandypeas","little_mixx","2badforyou","miss_jae",
"evelyn_jhonson3","hailey_madow","luvaprice","effieray","avroamy",
"chloewildd","zephirah_abney_","ellinrose","golden_alinee",
"dakota_blare","myliss","sophie_baley","katyerave","le_ah",
"erikabee","ellismeow","nixotica_","emmycb","sharlin_13",
"ginacali","ivytempt","nicdani_1","jully_lov","izzywild1",
"vonen_ray","creambaby1","chatur_babes_","lunnar_jade",
"iren_wagner","thaidream25","sexykiska","camilalovers01",
"diana_soft","black_cryystal","hi_miki","blissdilley",
"eves_bodyxxx","boobybliss","ohh_my_venus","svveetluna",
"therealfallingangel","okksanaocean","didiactive","glossybabe_",
"amywalker_","alexxiskye","cleopatra3101","assmerising","siennaruh",
"honeyyykate","aishabee","evva_foxxy","madelinefox_",
"stephie_martinez","a_anna","alicia_lang","artoftease",
"madison_littlee","sexxxsirens","alice_colt","oshun_25",
"caro_sanchezz","telladreamer_","themadisonshow","kari_brooks",
"gracieparker","madnessalise","heybanan","_hidden_gem_",
"honey_pinkgreen","playussoftly","cyanide_candys","sonya_kelsey",
"gisellee_","ana_beckett","babyallya","pattiwhite"
];

const previousStatus = {};
const listEl = document.getElementById("list");
const logEl = document.getElementById("log");
let isChecking = false;

const STATUS_LABELS = {
  public:"Openbaar",
  private:"Privéshow",
  group:"Groepsshow",
  away:"Afwezig",
  hidden:"Cam hidden",
  offline:"Offline",
  error:"Fout",
  unknown:"Onbekend",
  "checking...":"Controleren..."
};

const ONLINE_STATUSES = ["public","private","group","away","hidden"];

function getStatusLabel(status) {
  return STATUS_LABELS[status] || status;
}

function getStatusClass(status) {
  return "status-" + status.replace(/[^a-z-]/g,"");
}

function compareNames(a,b) {
  return a.localeCompare(b,undefined,{sensitivity:"base"});
}

function getSortedModels() {
  const mode = document.getElementById("sortFilter").value;

  return [...MODELS].sort((a,b) => {
    const sa = previousStatus[a] || "checking...";
    const sb = previousStatus[b] || "checking...";

    if (mode === "alphabetical") {
      return compareNames(a,b);
    }

    const rank = status => {
      if (mode === "offline") {
        if (status === "offline") return 0;
        if (ONLINE_STATUSES.includes(status)) return 1;
        return 2;
      }

      if (ONLINE_STATUSES.includes(status)) return 0;
      if (status === "offline") return 1;
      return 2;
    };

    return rank(sa)-rank(sb) || compareNames(a,b);
  });
}

let audioCtx;

function playBeep() {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();

    if (audioCtx.state === "suspended") audioCtx.resume();

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.frequency.value = 880;
    gain.gain.setValueAtTime(0.3,audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+0.8);

    osc.start();
    osc.stop(audioCtx.currentTime+0.8);
  } catch (e) {
    console.error("Audiofout:",e);
  }
}

function testSound() {
  playBeep();
}

async function requestPermission() {
  if (!("Notification" in window)) {
    alert("Je browser ondersteunt geen notificaties.");
    return;
  }

  const permission = await Notification.requestPermission();
  alert(permission === "granted"
    ? "Notificaties zijn ingeschakeld."
    : "Notificaties zijn niet toegestaan.");
}

function log(message) {
  const entry = document.createElement("div");
  entry.textContent = "[" + new Date().toLocaleTimeString() + "] " + message;
  logEl.prepend(entry);

  while (logEl.children.length > 100) {
    logEl.lastChild.remove();
  }
}

function render() {
  const counts = {
    public:0,
    private:0,
    group:0,
    away:0,
    hidden:0,
    offline:0,
    unknown:0
  };

  listEl.innerHTML = getSortedModels().map(name => {
    const status = previousStatus[name] || "checking...";

    if (Object.hasOwn(counts,status)) {
      counts[status]++;
    } else {
      counts.unknown++;
    }

    const online = ONLINE_STATUSES.includes(status);
    const hasError = ["error","unknown","checking..."].includes(status);
    const rowClass = online ? "online" : hasError ? "error" : "offline";

    const url = "https://chaturbate.com/" + encodeURIComponent(name) + "/";

    return `
      <div class="model ${rowClass}">
        <span><a href="${url}" target="_blank" rel="noopener noreferrer">${name}</a></span>
        <span class="status ${getStatusClass(status)}">${getStatusLabel(status)}</span>
      </div>
    `;
  }).join("");

  for (const status of Object.keys(counts)) {
    const element = document.getElementById(status + "Count");
    if (element) element.textContent = counts[status];
  }

  document.getElementById("unknownCount").textContent =
    counts.unknown + (counts.error || 0);
}

async function checkAll() {
  if (isChecking) return;

  isChecking = true;

  const button = document.getElementById("refreshButton");
  button.disabled = true;
  button.textContent = "Bezig...";

  try {
    const response = await fetch(
      "/.netlify/functions/cb-status?usernames=" +
      encodeURIComponent(MODELS.join(",")),
      {cache:"no-store"}
    );

    const data = await response.json();

    if (!response.ok || !data.statuses) {
      throw new Error(data.error || "Ongeldig antwoord van Netlify");
    }

    for (const name of MODELS) {
      const status = data.statuses[name.toLowerCase()] || "unknown";
      const oldStatus = previousStatus[name];

      if (
        status === "public" &&
        oldStatus !== undefined &&
        oldStatus !== "public"
      ) {
        playBeep();

        if (
          "Notification" in window &&
          Notification.permission === "granted"
        ) {
          new Notification(name + " is nu OPENBAAR!", {
            body:"Het model is terug in de openbare show."
          });
        }

        log("🔔 " + name + " is nu openbaar.");
      }

      if (status === "error" || status === "unknown") {
        if (oldStatus === undefined) {
          previousStatus[name] = status;
        }
      } else {
        previousStatus[name] = status;
      }
    }

    render();

    document.getElementById("lastCheck").textContent =
      "Laatste controle: " + new Date().toLocaleTimeString();

    log(data.complete
      ? "Controle afgerond."
      : "Controle afgerond; de resultaten kunnen onvolledig zijn.");

  } catch (error) {
    console.error(error);
    log("Controle mislukt: " + error.message);
  } finally {
    isChecking = false;
    button.disabled = false;
    button.textContent = "Nu controleren";
  }
}

render();
checkAll();
setInterval(checkAll,60000);
</script>

</body>
</html>
