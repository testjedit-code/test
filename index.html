  max-width: 800px;
  margin: 0 auto;

h1 { color: #ff69b4; margin-bottom: 5px; }

button {
  background: #ff69b4;

  border: none;
  padding: 10px 16px;
  border-radius: 6px;
  cursor: pointer;
  margin: 10px 8px 15px 0;
  font-size: 14px;
}

button:hover { background: #e84d9d; }
button:disabled { opacity: .6; cursor: wait; }

.stats {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin: 10px 0 18px;
}

.stat {
  background: #222;
  padding: 12px;
  border-radius: 8px;
  flex: 1;
  min-width: 100px;
  text-align: center;
}

.stat strong { display: block; font-size: 22px; }
.stat.online strong { color: #00ff00; }
.stat.offline strong { color: #999; }
.stat.errors strong { color: orange; }

.model {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 12px;
  margin: 4px 0;
  background: #222;
  border-radius: 6px;
  font-size: 14px;
  gap: 12px;
}

.model a { color: inherit; text-decoration: none; }
.model a:hover { color: #ff69b4; }
.online { border-left: 5px solid #00ff00; }
.offline { border-left: 5px solid #555; }
.error { border-left: 5px solid orange; }

.status {
  font-weight: bold;
  min-width: 90px;
  text-align: right;
  overflow-wrap: anywhere;
}

.online .status { color: #00ff00; }
.offline .status { color: #888; }
.error .status { color: orange; }

#list {
  max-height: 520px;
  overflow-y: auto;
}

#log {
  font-size: 13px;
  color: #aaa;
  margin-top: 20px;
  max-height: 180px;
  overflow-y: auto;
  background: #1a1a1a;
  padding: 10px;
  border-radius: 6px;
}

#lastCheck {
  color: #888;
  font-size: 12px;
  margin-bottom: 12px;
}

const previousStatus = {};

const ONLINE_STATUSES = [

  "private",
  "group",

// ============================================
// GELUID
// ============================================

let audioCtx;

function playBeep() {
  try {
    audioCtx = audioCtx ||
      new (window.AudioContext || window.webkitAudioContext)();

    if (audioCtx.state === "suspended") {
      audioCtx.resume();
    }

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.frequency.value = 880;

    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(
      0.01,
      audioCtx.currentTime + 0.8
    );

    osc.start();
    osc.stop(audioCtx.currentTime + 0.8);
  } catch (error) {
    console.error("Audio error:", error);
  }
}

function testSound() {
  playBeep();
}

// ============================================
// NOTIFICATIES
// ============================================

async function requestPermission() {
  if (!("Notification" in window)) {
    alert("Je browser ondersteunt geen notificaties.");
    return;
  }

  const permission = await Notification.requestPermission();

  if (permission === "granted") {
    alert("Notificaties zijn ingeschakeld!");
  } else {
    alert("Notificaties zijn niet toegestaan.");
  }
}

// ============================================
// LOG
// ============================================

function log(message) {
  const time = new Date().toLocaleTimeString();
  const entry = document.createElement("div");

  entry.textContent = `[${time}] ${message}`;
  logEl.prepend(entry);

  while (logEl.children.length > 100) {
    logEl.lastChild.remove();
  }
}

// ============================================
// STATUS WEERGAVE
// ============================================

function render() {
  let online = 0;
  let offline = 0;
  let errors = 0;

  listEl.innerHTML = MODELS.map(name => {
    const status = previousStatus[name] || "checking...";
    const isOnline = ONLINE_STATUSES.includes(status);

    const isError = [
      "error",
      "unknown"
    ].includes(status);

    if (isOnline) {
      online++;
    } else if (isError) {
      errors++;
    } else if (status === "offline") {
      offline++;
    }

    const cssClass = isOnline
      ? "online"
      : isError
        ? "error"
        : "offline";

    return `
      <div class="model ${cssClass}">
        <span>
          <a href="https://chaturbate.com/${encodeURIComponent(name)}/"
             target="_blank"
             rel="noopener noreferrer">${name}</a>
        </span>
        <span class="status">${status}</span>
      </div>
    `;
  }).join("");

  document.getElementById("onlineCount").textContent = online;
  document.getElementById("offlineCount").textContent = offline;
  document.getElementById("errorCount").textContent = errors;
}

// ============================================
// ÉÉN MODEL CONTROLEREN
// ============================================

async function checkOne(username) {
  try {
    const response = await fetch(
      `/.netlify/functions/cb-status?username=${encodeURIComponent(username)}`,
      { cache: "no-store" }
    );

    const data = await response.json();

    if (!response.ok || data.error) {
      console.error(username, data.error || "Onbekende API-fout");
      return "error";
    }

    const status =
      data.room_status || data.statuses?.[username.toLowerCase()];

    if (ONLINE_STATUSES.includes(status)) return status;
    if (status === "offline") return "offline";
    if (status === "error") return "error";

    return "unknown";
  } catch (error) {
    console.error("Controlefout:", username, error);
    return "error";
  }
}

// ============================================
// ALLE MODELLEN CONTROLEREN
// ============================================

async function checkAll() {
  if (isChecking) return;

  isChecking = true;

  const button = document.getElementById("refreshButton");
  button.disabled = true;
  button.textContent = "Bezig met controleren...";
  log("Controle gestart...");

  try {
    const response = await fetch(
      "/.netlify/functions/cb-status?usernames=" +
        encodeURIComponent(MODELS.join(",")),
      { cache: "no-store" }
    );

    const data = await response.json();

    if (!response.ok || !data.statuses) {
      throw new Error(data.error || "Ongeldig antwoord van Netlify");
    }

    for (const name of MODELS) {
      const status = data.statuses[name.toLowerCase()] || "unknown";
      const oldStatus = previousStatus[name];

      const wasOnline = ONLINE_STATUSES.includes(oldStatus);
      const isOnline = ONLINE_STATUSES.includes(status);

      if (isOnline && !wasOnline && oldStatus !== undefined) {
        playBeep();

        if (
          "Notification" in window &&
          Notification.permission === "granted"
        ) {
          new Notification(`${name} is ONLINE!`, {
            body: `Status: ${status}`,
            icon: "https://chaturbate.com/favicon.ico"
          });
        }

        log(`🔔 ${name} is nu online (${status})`);
      }

      if (status === "error") {
        log(`⚠️ Fout bij controleren van ${name}`);
      } else if (status === "unknown") {
        log(`⚠️ Status onbekend: ${name}`);
      }

      if (status === "offline" && wasOnline) {
        log(`${name} is offline gegaan`);
      }

      if (status !== "error" && status !== "unknown") {
        previousStatus[name] = status;
      } else if (oldStatus === undefined) {
        previousStatus[name] = status;
      }
    }

    render();

    document.getElementById("lastCheck").textContent =
      "Laatste controle: " + new Date().toLocaleTimeString();

    log(
      data.complete
        ? "Controle afgerond."
        : "Gedeeltelijke controle afgerond; ontbrekende modellen zijn niet als offline gemarkeerd."
    );
  } catch (error) {
    console.error("Controlefout:", error);
    log("⚠️ Controle mislukt: " + error.message);
  } finally {
    isChecking = false;
    button.disabled = false;
    button.textContent = "Nu controleren";
  }
}
