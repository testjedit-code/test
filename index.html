
<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modelmonitor</title>

  <style>
    :root {
      color-scheme: dark;
      font-family: Arial, sans-serif;
      background: #111318;
      color: #f2f3f5;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
    }

    main {
      max-width: 1100px;
      margin: 0 auto;
    }

    h1 {
      margin-top: 0;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      margin-bottom: 18px;
    }

    select,
    button {
      padding: 10px 12px;
      border: 1px solid #454955;
      border-radius: 8px;
      background: #20232b;
      color: #fff;
      font-size: 14px;
    }

    button {
      cursor: pointer;
    }

    button:hover {
      background: #303541;
    }

    #summary {
      margin: 12px 0;
      color: #c3c6ce;
    }

    #message {
      margin: 12px 0;
      color: #f0c674;
    }

    .model-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(245px, 1fr));
      gap: 10px;
    }

    .model {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 14px;
      border: 1px solid #343843;
      border-radius: 10px;
      background: #1b1e25;
      min-width: 0;
    }

    .model-name {
      color: #f2f3f5;
      text-decoration: none;
      overflow-wrap: anywhere;
    }

    .model-name:hover {
      text-decoration: underline;
    }

    .status {
      flex-shrink: 0;
      padding: 5px 8px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
      text-transform: uppercase;
    }

    .status-online {
      color: #9af0b0;
      background: #173b27;
    }

    .status-offline {
      color: #c2c5cd;
      background: #30333b;
    }

    .status-private,
    .status-group,
    .status-away {
      color: #f8d58a;
      background: #45371b;
    }

    .status-error,
    .status-unknown,
    .status-checking {
      color: #ffb0b0;
      background: #492727;
    }

    @media (max-width: 500px) {
      body {
        padding: 14px;
      }

      .model-list {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <main>
    <h1>Modelmonitor</h1>

    <div class="controls">
      <label for="sortFilter">Sorteren:</label>

      <select id="sortFilter">
        <option value="online">Online bovenaan (alfabetisch)</option>
        <option value="alphabetical">Alles op alfabet</option>
        <option value="offline">Offline bovenaan (alfabetisch)</option>
      </select>

      <button id="refreshButton" type="button">
        Nu controleren
      </button>

      <button id="notificationButton" type="button">
        Meldingen inschakelen
      </button>
    </div>

    <p id="summary">Statussen worden geladen...</p>
    <p id="message" role="status"></p>

    <section id="modelList" class="model-list"></section>
  </main>

    ];

    const ONLINE_STATUSES = [
      "public",
      "private",
      "group",
      "away"
    ];

    const ERROR_STATUSES = [
      "error",
      "unknown",
      "checking..."
    ];

    const POLL_INTERVAL = 90_000;

    const statusByName = Object.fromEntries(
      MODELS.map(name => [name, "checking..."])
    );

    const sortFilter = document.getElementById("sortFilter");
    const modelList = document.getElementById("modelList");
    const summary = document.getElementById("summary");
    const message = document.getElementById("message");
    const refreshButton = document.getElementById("refreshButton");
    const notificationButton = document.getElementById("notificationButton");

    let isChecking = false;
    let notificationsEnabled = false;
    let previousStatus = {};

    try {
      const saved = localStorage.getItem("cbMonitorLastStatus_v1");
      if (saved) {
        previousStatus = JSON.parse(saved);
      }
    } catch {
      previousStatus = {};
    }

    function compareNames(a, b) {
      return a.localeCompare(b, "nl", {
        sensitivity: "base"
      });
    }

    function isErrorStatus(status) {
      return ERROR_STATUSES.includes(
        String(status || "").toLowerCase()
      );
    }

    function getSortGroup(status, mode) {
      const normalized = String(status || "unknown").toLowerCase();

      // Fouten, onbekende statussen en controles blijven bovenaan.
      if (isErrorStatus(normalized)) {
        return 0;
      }

      const isOnline = ONLINE_STATUSES.includes(normalized);

      if (mode === "alphabetical") {
        return 1;
      }

      if (mode === "offline") {
        return isOnline ? 2 : 1;
      }

      // Standaard: online modellen eerst.
      return isOnline ? 1 : 2;
    }

    function getSortedModels() {
      const mode = sortFilter.value;

      return [...MODELS].sort((a, b) => {
        const statusA = statusByName[a] || "unknown";
        const statusB = statusByName[b] || "unknown";

        const groupA = getSortGroup(statusA, mode);
        const groupB = getSortGroup(statusB, mode);

        if (groupA !== groupB) {
          return groupA - groupB;
        }

        return compareNames(a, b);
      });
    }

    function getStatusLabel(status) {
      const normalized = String(status || "unknown").toLowerCase();

      const labels = {
        public: "Online",
        private: "Privé",
        group: "Groep",
        away: "Afwezig",
        offline: "Offline",
        error: "Fout",
        unknown: "Onbekend",
        "checking...": "Controleren..."
      };

      return labels[normalized] || normalized;
    }

    function getStatusClass(status) {
      const normalized = String(status || "unknown").toLowerCase();

      if (normalized === "public") {
        return "status-online";
      }

      if (normalized === "offline") {
        return "status-offline";
      }

      if (["private", "group", "away"].includes(normalized)) {
        return "status-" + normalized;
      }

      return "status-" + (
        ERROR_STATUSES.includes(normalized) ? normalized.replaceAll(".", "") : "unknown"
      );
    }

    function render() {
      const sortedModels = getSortedModels();
      const fragment = document.createDocumentFragment();

      let onlineCount = 0;
      let offlineCount = 0;
      let errorCount = 0;

      for (const name of sortedModels) {
        const status = String(
          statusByName[name] || "unknown"
        ).toLowerCase();

        if (ONLINE_STATUSES.includes(status)) {
          onlineCount++;
        } else if (status === "offline") {
          offlineCount++;
        } else {
          errorCount++;
        }

        const card = document.createElement("article");
        card.className = "model";

        const link = document.createElement("a");
        link.className = "model-name";
        link.href = "https://chaturbate.com/" +
          encodeURIComponent(name) + "/";
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = name;

        const badge = document.createElement("span");
        badge.className = "status " + getStatusClass(status);
        badge.textContent = getStatusLabel(status);

        card.append(link, badge);
        fragment.appendChild(card);
      }

      modelList.replaceChildren(fragment);

      summary.textContent =
        `${onlineCount} online · ${offlineCount} offline · ` +
        `${errorCount} onbekend of fout · ${MODELS.length} modellen`;
    }

    function notifyOnline(name) {
      if (
        !notificationsEnabled ||
        !("Notification" in window) ||
        Notification.permission !== "granted"
      ) {
        return;
      }

      const notification = new Notification(
        `${name} is online`,
        {
          body: "Open de monitor om de status te bekijken."
        }
      );

      notification.onclick = () => {
        window.focus();
        window.open(
          "https://chaturbate.com/" + encodeURIComponent(name) + "/",
          "_blank",
          "noopener"
        );
      };
    }

    async function checkAll() {
      if (isChecking) {
        return;
      }

      isChecking = true;
      refreshButton.disabled = true;
      message.textContent = "Statussen controleren...";

      render();

      try {
        const usernames = MODELS.join(",");
        const url =
          "/.netlify/functions/cb-status?usernames=" +
          encodeURIComponent(usernames);

        const response = await fetch(url, {
          cache: "no-store"
        });

        const data = await response.json();

        if (!response.ok || !data.statuses) {
          throw new Error(
            data.error || "De statuscontrole is mislukt."
          );
        }

        for (const name of MODELS) {
          const newStatus = String(
            data.statuses[name] || "unknown"
          ).toLowerCase();

          const oldStatus = String(
            previousStatus[name] || "unknown"
          ).toLowerCase();

          statusByName[name] = newStatus;

          if (
            ONLINE_STATUSES.includes(newStatus) &&
            !ONLINE_STATUSES.includes(oldStatus)
          ) {
            notifyOnline(name);
          }

          previousStatus[name] = newStatus;
        }

        try {
          localStorage.setItem(
            "cbMonitorLastStatus_v1",
            JSON.stringify(previousStatus)
          );
        } catch {
          // De monitor blijft werken als lokale opslag niet beschikbaar is.
        }

        message.textContent = data.complete === false
          ? "Controle afgerond, maar niet alle resultaten konden worden bevestigd."
          : "Laatst gecontroleerd: " +
            new Date().toLocaleTimeString("nl-NL");

      } catch (error) {
        message.textContent =
          "Fout bij controleren: " + error.message;

        for (const name of MODELS) {
          if (
            !statusByName[name] ||
            statusByName[name] === "checking..."
          ) {
            statusByName[name] = "unknown";
          }
        }
      } finally {
        isChecking = false;
        refreshButton.disabled = false;
        render();
      }
    }

    sortFilter.addEventListener("change", render);
    refreshButton.addEventListener("click", checkAll);

    notificationButton.addEventListener("click", async () => {
      if (!("Notification" in window)) {
        message.textContent =
          "Deze browser ondersteunt geen bureaubladmeldingen.";
        return;
      }

      const permission = await Notification.requestPermission();

      if (permission === "granted") {
        notificationsEnabled = true;
        notificationButton.textContent = "Meldingen ingeschakeld";
        message.textContent = "Bureaubladmeldingen zijn ingeschakeld.";
      } else {
        message.textContent =
          "Meldingen zijn niet toegestaan in de browserinstellingen.";
      }
    });

    render();
    checkAll();
    setInterval(checkAll, POLL_INTERVAL);
  </script>
